# Starship Prompt Configuration
# https://starship.rs/config/

# Timeout for commands
command_timeout = 1000

# Add newline before prompt
add_newline = true

# Format
format = """
[╭─](bright-blue)$username$hostname$container$shlvl${custom.project}$directory$git_branch$git_state$git_status$docker_context$python$nodejs$rust$golang$java
[╰─](bright-blue)$character"""

# Character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[V](bold green)"

# Username
[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

# Hostname
[hostname]
ssh_only = true
style = "bold green"
format = "[$hostname]($style) in "

# Container
#
# hostname is ssh_only, so without this a devcontainer shell is visually
# identical to a host shell -- which matters here, where project builds and
# tests are supposed to run in the container and the host stays toolchain-free.
# Renders only when actually containerized.
[container]
symbol = "⬢"
style = "bold bright-yellow"
format = "[$symbol $name]($style) "

# Shell nesting depth
#
# Subshells stack silently; this catches the case where you think you left one
# and did not. Below the threshold it prints nothing, so a plain login shell is
# unaffected -- raise it if a container baseline turns this always-on.
[shlvl]
disabled = false
threshold = 2
symbol = "↕"
style = "bold bright-yellow"
format = "[$symbol$shlvl]($style) "

# Project identity
#
# truncate_to_repo makes $directory show a path relative to the enclosing
# checkout, so the project name is exactly what it drops. Under a wt
# orchestration dir every worktree is its own checkout, which leaves the
# prompt showing "main" or "feat-x" with no hint of which project that is.
# This restores the name $directory cannot.
#
# Scoped to orchestration dirs on purpose: there the name sits above every
# checkout, so it can never collide with what $directory prints. A plain
# clone keeps its own name as the first component of the truncated path
# until you are truncation_length deep, so printing it here would read as
# "dotfiles ▸ dotfiles/bin" most of the time.
[custom.project]
description = "wt orchestration project name, which truncate_to_repo hides"
when = true
shell = ["sh"]
# Orchestration root = bare repo.git (matches find_orchestration_root in wt).
# The checkout test keeps transit dirs (the root itself, wt/) unannotated --
# $directory already spells those out in full.
command = '''
d=$PWD; checkout=; orchestration=
while [ -n "$d" ] && [ "$d" != "/" ]; do
    [ -z "$checkout" ] && [ -e "$d/.git" ] && checkout="$d"
    if [ -d "$d/repo.git" ]; then orchestration="$d"; break; fi
    d=${d%/*}
done
[ -n "$checkout" ] && [ -n "$orchestration" ] && printf '%s' "${orchestration##*/}"
exit 0
'''
style = "bold bright-blue"
format = "([$output ▸]($style) )"

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold bright-cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 🔒"

# Git Branch
[git_branch]
symbol = " "
style = "bold bright-magenta"
format = "on [$symbol$branch]($style) "

# Git State
#
# Names the in-progress operation and its step count, so an interrupted
# stacked-PR rebase is visible without running git status. Silent otherwise.
[git_state]
style = "bold bright-yellow"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

# Git Status
[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Programming Languages
[python]
symbol = " "
style = "bright-yellow"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bright-green"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "bright-red"
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
style = "bright-cyan"
format = "via [$symbol$version]($style) "

[java]
symbol = " "
style = "bright-red"
format = "via [$symbol$version]($style) "

[ruby]
symbol = " "
style = "bright-red"
format = "via [$symbol$version]($style) "

# Docker
[docker_context]
symbol = " "
style = "bright-blue"
format = "via [$symbol$context]($style) "
only_with_files = true

# Kubernetes
[kubernetes]
disabled = true
symbol = "☸ "
style = "bright-cyan"
format = "on [$symbol$context( \\($namespace\\))]($style) "

# Command Duration
[cmd_duration]
min_time = 2000
style = "bright-yellow"
format = "took [$duration]($style) "

# Time
[time]
disabled = true
style = "white"
format = "at [$time]($style) "

# Status
[status]
disabled = false
style = "red"
format = "[$symbol$status]($style) "

# Package Version
[package]
disabled = true

# AWS
[aws]
symbol = "☁️  "
style = "bright-yellow"
format = "on [$symbol$profile(\\($region\\))]($style) "

# Battery
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
disabled = true
