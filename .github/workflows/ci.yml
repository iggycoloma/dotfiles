name: CI

on:
  push:
    branches: [ main, master, features/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux-containers:
    name: Test on ${{ matrix.os }} (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu variants (WSL2 proxy)
          - os: ubuntu:20.04
            shell: bash
            platform: ubuntu-20.04
          - os: ubuntu:22.04
            shell: bash
            platform: ubuntu-22.04
          - os: ubuntu:22.04
            shell: zsh
            platform: ubuntu-22.04
          - os: ubuntu:24.04
            shell: bash
            platform: ubuntu-24.04
          - os: ubuntu:24.04
            shell: zsh
            platform: ubuntu-24.04

          # Debian variants
          - os: debian:bullseye
            shell: bash
            platform: debian-11
          - os: debian:bookworm
            shell: bash
            platform: debian-12
          - os: debian:bookworm
            shell: zsh
            platform: debian-12

          # Alpine (musl libc, apk package manager)
          - os: alpine:latest
            shell: bash
            platform: alpine

    container:
      image: ${{ matrix.os }}

    steps:
      - name: Install basic dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            # Debian/Ubuntu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git curl ca-certificates sudo
            # Install zsh if needed for this test
            if [ "${{ matrix.shell }}" = "zsh" ]; then
              apt-get install -y zsh
            fi
          elif command -v apk >/dev/null 2>&1; then
            # Alpine
            apk add --no-cache git curl bash sudo
            # Alpine uses ash/bash, zsh tests would need apk add zsh
            if [ "${{ matrix.shell }}" = "zsh" ]; then
              apk add --no-cache zsh
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity for testing
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci-test@example.com"

      - name: Run installation
        run: |
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Installation completed in $((END_TIME - START_TIME))s" >&2
        env:
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Test shell startup (${{ matrix.shell }}) with timing diagnostics
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c 'source ~/.bashrc && echo "Bash startup successful"'
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c 'source ~/.zshrc && echo "Zsh startup successful"'
          fi

      - name: Run unit tests
        run: |
          START_TIME=$(date +%s)
          bash tests/unit-tests.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Unit tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Run integration tests
        run: |
          START_TIME=$(date +%s)
          bash tests/test-install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Integration tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Verify completions artifacts
        run: |
          test -f "$HOME/.config/zsh/completions.zsh" && echo "✓ zsh completions config present" || (echo "✗ zsh completions config missing" && exit 1)
          test -d "$HOME/.local/share/bash-completion/completions" && echo "✓ bash completions dir present" || (echo "✗ bash completions dir missing" && exit 1)

      - name: Verify core tools installed
        run: |
          echo "Checking core tools..."
          command -v fzf || echo "WARNING: fzf not found"
          command -v rg || echo "WARNING: ripgrep not found"
          command -v fd || echo "WARNING: fd not found"
          command -v bat || echo "WARNING: bat not found"
          command -v jq || echo "WARNING: jq not found"
          command -v eza || echo "WARNING: eza not found"
          command -v zoxide || echo "WARNING: zoxide not found"
          command -v starship || echo "WARNING: starship not found"
          command -v delta || echo "WARNING: delta not found"

      - name: Test key aliases and functions
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c 'source ~/.bashrc && \
              type mkcd >/dev/null 2>&1 && echo "✓ mkcd function available" || echo "✗ mkcd not found"; \
              alias ll >/dev/null 2>&1 && echo "✓ ll alias available" || echo "✗ ll not found"'
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c 'source ~/.zshrc && \
              type mkcd >/dev/null 2>&1 && echo "✓ mkcd function available" || echo "✗ mkcd not found"; \
              alias ll >/dev/null 2>&1 && echo "✓ ll alias available" || echo "✗ ll not found"'
          fi

      - name: Starship init smoke test
        run: |
          if command -v starship >/dev/null 2>&1; then
            bash -lc 'eval "$(starship init bash)" >/dev/null 2>&1 && echo "Starship init OK"'
          else
            echo "Starship not installed"
          fi
      - name: Test idempotency (run install again)
        run: |
          echo "Running install.sh second time to test idempotency..."
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Idempotency test (2nd install) completed in $((END_TIME - START_TIME))s" >&2
        env:
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

  test-macos:
    name: Test on macOS ${{ matrix.version }} (${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            version: "15"
            shell: bash
          - runner: macos-15
            version: "15"
            shell: zsh
          - runner: macos-26
            version: "26"
            shell: bash
          - runner: macos-26
            version: "26"
            shell: zsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew (if not present)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Configure git identity for testing
        run: |
          git config --global user.name "CI Test User"
          git config --global user.email "ci-test@example.com"

      - name: Run installation
        run: |
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Installation completed in $((END_TIME - START_TIME))s" >&2
        env:
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Test shell startup (${{ matrix.shell }}) with timing diagnostics
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c 'source ~/.bashrc && echo "Bash startup successful"'
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c 'source ~/.zshrc && echo "Zsh startup successful"'
          fi

      - name: Run unit tests
        run: |
          START_TIME=$(date +%s)
          bash tests/unit-tests.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Unit tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Run integration tests
        run: |
          START_TIME=$(date +%s)
          bash tests/test-install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Integration tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Verify completions artifacts
        run: |
          test -f "$HOME/.config/zsh/completions.zsh" && echo "✓ zsh completions config present" || (echo "✗ zsh completions config missing" && exit 1)
          test -d "$HOME/.local/share/bash-completion/completions" && echo "✓ bash completions dir present" || (echo "✗ bash completions dir missing" && exit 1)

      - name: Verify core tools installed
        run: |
          echo "Checking core tools..."
          command -v fzf || echo "WARNING: fzf not found"
          command -v rg || echo "WARNING: ripgrep not found"
          command -v fd || echo "WARNING: fd not found"
          command -v bat || echo "WARNING: bat not found"
          command -v jq || echo "WARNING: jq not found"
          command -v eza || echo "WARNING: eza not found"
          command -v zoxide || echo "WARNING: zoxide not found"
          command -v starship || echo "WARNING: starship not found"
          command -v delta || echo "WARNING: delta not found"

      - name: Test key aliases and functions
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c 'source ~/.bashrc && \
              type mkcd >/dev/null 2>&1 && echo "✓ mkcd function available" || echo "✗ mkcd not found"; \
              alias ll >/dev/null 2>&1 && echo "✓ ll alias available" || echo "✗ ll not found"'
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c 'source ~/.zshrc && \
              type mkcd >/dev/null 2>&1 && echo "✓ mkcd function available" || echo "✗ mkcd not found"; \
              alias ll >/dev/null 2>&1 && echo "✓ ll alias available" || echo "✗ ll not found"'
          fi

      - name: Starship init smoke test
        run: |
          if command -v starship >/dev/null 2>&1; then
            bash -lc 'eval "$(starship init bash)" >/dev/null 2>&1 && echo "Starship init OK"'
          else
            echo "Starship not installed"
          fi

      - name: Test idempotency (run install again)
        run: |
          echo "Running install.sh second time to test idempotency..."
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Idempotency test (2nd install) completed in $((END_TIME - START_TIME))s" >&2
        env:
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

  test-codespaces-simulation:
    name: Test Codespaces Simulation (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]

    container:
      image: mcr.microsoft.com/devcontainers/base:ubuntu

    steps:
      - name: Install basic dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git curl ca-certificates sudo
          if [ "${{ matrix.shell }}" = "zsh" ]; then
            apt-get install -y zsh
          fi

      - name: Setup git configuration (simulate Codespaces)
        run: |
          git config --system user.name "Codespaces Test User"
          git config --system user.email "codespaces-test@github.com"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run installation with Codespaces environment
        run: |
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Codespaces simulation installation completed in $((END_TIME - START_TIME))s" >&2
        env:
          # Simulate Codespaces environment
          CODESPACES: true
          CODESPACE_NAME: ci-test-codespace
          GIT_COMMITTER_NAME: Codespaces Test User
          GIT_COMMITTER_EMAIL: codespaces-test@github.com
          GITHUB_USER: testuser
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: https://github.com
          GITHUB_API_URL: https://api.github.com
          # Standard CI vars
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Verify Codespaces detection
        shell: bash
        run: |
          source bootstrap/detect.sh
          ENV=$(detect_environment)
          if [ "$ENV" = "codespaces" ]; then
            echo "✓ Correctly detected Codespaces environment"
          else
            echo "✗ Failed to detect Codespaces environment (got: $ENV)"
            exit 1
          fi
        env:
          CODESPACES: true

      - name: Test shell startup (${{ matrix.shell }})
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c 'source ~/.bashrc && echo "Bash startup successful"'
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c 'source ~/.zshrc && echo "Zsh startup successful"'
          fi

      - name: Run unit tests
        run: |
          START_TIME=$(date +%s)
          bash tests/unit-tests.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Codespaces unit tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Run integration tests
        run: |
          START_TIME=$(date +%s)
          bash tests/test-install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Codespaces integration tests completed in $((END_TIME - START_TIME))s" >&2
        env:
          DOTFILES_DIR: ${{ github.workspace }}

      - name: Verify git configuration
        run: |
          # Verify git can commit (important for Codespaces)
          test -n "$(git config user.name)" && echo "✓ Git user.name is set: $(git config user.name)" || (echo "✗ Git user.name missing" && exit 1)
          test -n "$(git config user.email)" && echo "✓ Git user.email is set: $(git config user.email)" || (echo "✗ Git user.email missing" && exit 1)
          # Verify XDG git config symlink
          test -L "$HOME/.config/git/config" && echo "✓ Git XDG config symlink present" || (echo "✗ XDG config symlink missing" && exit 1)
          # Verify dotfiles settings are loaded
          test "$(git config --get core.pager)" = "delta" && echo "✓ Dotfiles git settings loaded (delta pager)" || echo "⚠ Delta pager not configured"

      - name: Test idempotency
        run: |
          echo "Running install.sh second time to test idempotency..."
          START_TIME=$(date +%s)
          bash install.sh
          END_TIME=$(date +%s)
          echo "[CI-TIMING] Codespaces idempotency test completed in $((END_TIME - START_TIME))s" >&2
        env:
          CODESPACES: true
          CI: true
          DOTFILES_DIR: ${{ github.workspace }}

  test-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-linux-containers, test-macos, test-codespaces-simulation]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-linux-containers.result }}" = "success" ] && \
             [ "${{ needs.test-macos.result }}" = "success" ] && \
             [ "${{ needs.test-codespaces-simulation.result }}" = "success" ]; then
            echo "✓ All tests passed!"
            exit 0
          else
            echo "✗ Some tests failed"
            echo "Linux containers: ${{ needs.test-linux-containers.result }}"
            echo "macOS: ${{ needs.test-macos.result }}"
            echo "Codespaces simulation: ${{ needs.test-codespaces-simulation.result }}"
            exit 1
          fi
