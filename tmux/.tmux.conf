# Tmux Configuration
# Modern tmux config for terminal multiplexing

# Change prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer
set -g history-limit 50000

# Display messages for longer
set -g display-time 2000

# Address vim mode switching delay
set -s escape-time 0

# Focus events for vim
set -g focus-events on

# Aggressive resize
setw -g aggressive-resize on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Navigate windows
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode with vim keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Paste
bind p paste-buffer

# Status bar
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# Status bar colors
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left "#[fg=#7aa2f7,bold]#S #[fg=#c0caf5]| "
set -g status-right "#[fg=#9ece6a]%Y-%m-%d #[fg=#c0caf5]| #[fg=#7aa2f7]%H:%M:%S "

# Window status
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7dcfff,bold] #I:#W "

# Pane border
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#1a1b26,fg=#7dcfff"

# Clock mode
setw -g clock-mode-colour "#7aa2f7"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Load local tmux config if it exists
if-shell "[ -f ~/.tmux.conf.local ]" "source ~/.tmux.conf.local"
